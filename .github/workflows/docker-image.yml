name: Docker image

# Builds docker/ and publishes the agent image to Docker Hub.
# - Pull request touching docker/**: build (amd64) to VERIFY it compiles — no push.
# - Push to main touching docker/** (or manual dispatch): build multi-arch on
#   native runners and push thunderockforge/forge-agent:latest.
#
# Requires repo secrets: DOCKERHUB_USERNAME, DOCKERHUB_TOKEN (a Docker Hub access token).
# Action versions use major tags for readability; pin to SHAs to match release.yml if desired.

on:
  push:
    branches: [main]
    paths:
      - 'docker/**'
      - 'electron/ipc/pty.ts'
      - 'electron/ipc/docker-gsd-seed.ts'
      - 'electron/ipc/gsd-seeding.integration.test.ts'
      - 'package.json'
      - '.github/workflows/docker-image.yml'
  pull_request:
    paths:
      - 'docker/**'
      - 'electron/ipc/pty.ts'
      - 'electron/ipc/docker-gsd-seed.ts'
      - 'electron/ipc/gsd-seeding.integration.test.ts'
      - 'package.json'
      - '.github/workflows/docker-image.yml'
  workflow_dispatch:

env:
  IMAGE: docker.io/thunderockforge/forge-agent

jobs:
  # ---- PR verification: build, load, and prove the codex+claude gsd bake ----
  verify:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build (amd64, load for verification)
        uses: docker/build-push-action@v6
        with:
          context: ./docker
          platforms: linux/amd64
          push: false
          load: true
          tags: forge-agent:ci
      - name: Verify gsd bake — codex (CDX-02/CDX-03) + Claude non-regression (Pitfall 4)
        run: |
          docker run --rm --user 1000:1000 forge-agent:ci sh -c '
            set -e
            # CDX-03 (file-presence proxy): top-level gsd prompts → /prompts:gsd-*
            test "$(ls ~/.codex/prompts/gsd-*.md | wc -l)" -ge 20
            test -f ~/.codex/prompts/gsd-plan-phase.md
            # CDX-02: agent registrations + baked dirs
            grep -q "\[agents.gsd-" ~/.codex/config.toml
            ls -d ~/.codex/agents ~/.codex/skills
            # Claude non-regression (Pitfall 4): the Claude gsd layer survived the codex bake
            ls ~/.claude/commands/gsd/*.md >/dev/null
            # Informational only (RESEARCH Open Q1 — do NOT hard-require .codex/get-shit-done):
            ls ~/.codex
          '
      # ---- the LOAD-BEARING gate: the real runtime seed into the run-user HOME ----
      # The baked block above reads /home/agent (the false-pass that shipped the bug).
      # This runs the REAL ensureGsdSkeleton staging + GSD_SEED_ENTRYPOINT as the
      # runner's non-1000 uid (1001) with HOME=/home/forge and asserts the SEEDED HOME
      # for BOTH agents. forge-agent:ci is already in the daemon (load:true) — no pull.
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Verify runtime gsd seeding — both agents (VER-01/VER-02)
        run: FORGE_AGENT_IMAGE=forge-agent:ci npm run test:gsd-docker

  # ---- main / manual: build each arch on its native runner, push by digest ----
  build:
    if: github.event_name != 'pull_request'
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            arch: amd64
            runner: ubuntu-24.04
          - platform: linux/arm64
            arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: ./docker
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
      - name: Export digest
        run: |
          mkdir -p "${RUNNER_TEMP}/digests"
          digest="${{ steps.build.outputs.digest }}"
          touch "${RUNNER_TEMP}/digests/${digest#sha256:}"
      - name: Upload digest
        uses: actions/upload-artifact@v4
        with:
          name: digest-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  # ---- combine per-arch digests into one multi-arch :latest tag ----
  merge:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - name: Download digests
        uses: actions/download-artifact@v4
        with:
          path: ${{ runner.temp }}/digests
          pattern: digest-*
          merge-multiple: true
      - uses: docker/setup-buildx-action@v3
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Create and push manifest list (:latest)
        working-directory: ${{ runner.temp }}/digests
        run: |
          docker buildx imagetools create -t ${{ env.IMAGE }}:latest \
            $(printf '${{ env.IMAGE }}@sha256:%s ' *)
      - name: Inspect
        run: docker buildx imagetools inspect ${{ env.IMAGE }}:latest
